[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ops-narrative"
version = "0.6.0"
description = "Evidence-backed executive narratives from synthetic operations and finance KPI packs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "SBroTheLegend" }]
keywords = ["fp&a", "operations", "narrative", "kpi", "faithfulness"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "matplotlib>=3.8,<4",
    "streamlit>=1.39,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
ops-narrative = "ops_narrative.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
